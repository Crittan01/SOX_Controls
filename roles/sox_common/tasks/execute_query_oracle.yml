# ═══════════════════════════════════════════════════════════════
# SOX COMMON - EJECUTAR QUERY ORACLE
# ═══════════════════════════════════════════════════════════════
- name: "SOX Common | Ejecutar Query Oracle en Multiple Bases"
  block:
    - name: "SOX Common | Inicializar Resultados"
      ansible.builtin.set_fact:
        query_results_all: []

    - name: "SOX Common | Ejecutar Query en Oracle"
      oracle_sql_async:
        hostname: "{{ hostvars[item].ansible_host }}"
        port: "{{ hostvars[item].oracle_port }}"
        service_name: "{{ hostvars[item].oracle_service_name }}"
        username: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        mode: "{{ hostvars[item].oracle_mode | default('normal') }}"
        sql: "{{ oracle_query }}"
      loop: "{{ target_hosts }}"
      register: oracle_results
      ignore_errors: true

    - name: "SOX Common | DEBUG - Ejecutar Query en Oracle"
      ansible.builtin.debug:
        var: oracle_results
      when: debug_playbook | default(false)

    - name: "SOX Common | Procesar Resultados"
      ansible.builtin.set_fact:
        query_results_all: >-
          {{
            query_results_all + [{
              'database_name': hostvars[item.item].oracle_service_name,
              'database_host': hostvars[item.item].ansible_host,
              'query_result': item.msg | default([]) if not item.failed | default(false) else [],
              'rows_count': (item.msg | default([]) | length) if not item.failed | default(false) else 0,
              'execution_success': not (item.failed | default(false)),
              'error_message': item.msg | default('') if item.failed | default(false) else ''
            }]
          }}
      loop: "{{ oracle_results.results }}"

  rescue:
    - name: "SOX Common | Error en Ejecución de Query"
      ansible.builtin.fail:
        msg: "Error crítico ejecutando query Oracle: {{ ansible_failed_result.msg }}"

# Exponer resultados como fact accesible
- name: "SOX Common | Retornar Resultados Consolidados"
  ansible.builtin.set_fact:
    oracle_query_results:
      results: "{{ query_results_all }}"

- name: "SOX Common | DEBUG - Retornar Resultados Consolidados"
  ansible.builtin.debug:
    var: oracle_query_results
  when: debug_playbook | default(false)
